<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1c20; --muted: #8a8f98; --line: #ececf0;
    --chip: #f4f4f7; --accent: #d97757; --accent2: #e08a6f;
    --ok: #2fa863; --off: #e5484d; --btn: #f4f4f7; --btn-hover: #e9e9ee; --shadow: 0 8px 30px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1d21; --fg: #eceef2; --muted: #8a8f98; --line: #2c2f36; --chip: #26292f; --btn: #26292f; --btn-hover: #31353d; --shadow: 0 8px 30px rgba(0,0,0,.4); }
  }
  :root[data-theme="dark"] { --bg: #1b1d21; --fg: #eceef2; --muted: #8a8f98; --line: #2c2f36; --chip: #26292f; --btn: #26292f; --btn-hover: #31353d; --shadow: 0 8px 30px rgba(0,0,0,.4); }
  * { box-sizing: border-box; }
  body { font: 13.5px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; margin: 0; width: 288px; color: var(--fg); background: var(--bg); }
  .head { display: flex; align-items: center; gap: 10px; padding: 15px 16px 12px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -.5px; box-shadow: 0 2px 8px rgba(217,119,87,.35); }
  .title { font-weight: 700; font-size: 14px; }
  .title small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .3px; }
  .status { display: flex; align-items: center; gap: 9px; margin: 2px 16px 12px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--chip); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; position: relative; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 0 rgba(47,168,99,.5); animation: pulse 2s infinite; }
  .dot.off { background: var(--off); }
  .dot.paused { background: #F5C518; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47,168,99,.5);} 70% { box-shadow: 0 0 0 7px rgba(47,168,99,0);} 100% { box-shadow: 0 0 0 0 rgba(47,168,99,0);} }
  .state { font-weight: 650; font-size: 13px; }
  .info { padding: 0 16px; display: grid; gap: 9px; }
  .kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .kv .k { color: var(--muted); font-size: 12px; }
  .kv .v { font-size: 12px; font-weight: 600; text-align: right; }
  code { font: 11.5px "SF Mono", ui-monospace, Consolas, monospace; background: var(--chip); border: 1px solid var(--line); padding: 2px 7px; border-radius: 6px; color: var(--fg); }
  .err { color: var(--off); font-size: 11.5px; margin: 2px 16px 0; word-break: break-word; }
  .err:empty { display: none; }
  .actions { display: grid; gap: 8px; padding: 14px 16px 16px; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--btn); color: var(--fg); padding: 9px 12px; border-radius: 10px; cursor: pointer; transition: background .12s, transform .05s; display: flex; align-items: center; justify-content: center; gap: 7px; }
  button:hover { background: var(--btn-hover); }
  button:active { transform: translateY(1px); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; box-shadow: 0 2px 10px rgba(217,119,87,.3); }
  button.primary:hover { filter: brightness(1.05); background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .foot { border-top: 1px solid var(--line); padding: 9px 16px; color: var(--muted); font-size: 10.5px; display: flex; justify-content: space-between; align-items: center; }
  .foot a { color: inherit; text-decoration: none; font-weight: 600; letter-spacing: .2px; }
  .foot a:hover { color: var(--accent); }
  .ico { width: 15px; height: 15px; }
  .theme { margin-left: auto; display: flex; gap: 2px; background: var(--chip); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .theme button { border: none; background: transparent; padding: 5px 7px; border-radius: 7px; color: var(--muted); box-shadow: none; }
  .theme button:hover { background: transparent; color: var(--fg); }
  .theme button.sel { background: var(--bg); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .theme .ico { width: 14px; height: 14px; }
  .pause { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 16px 0; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--chip); }
  .pause-t { font-weight: 650; font-size: 13px; }
  .pause-s { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .switch { width: 44px; height: 26px; border-radius: 14px; border: none; background: var(--ok); padding: 0; position: relative; cursor: pointer; transition: background .15s; flex: none; box-shadow: none; }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch[aria-checked="true"] { background: #b8860b; }
  .switch[aria-checked="true"] .knob { left: 21px; }
  .pw { margin: 10px 16px 0; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; background: var(--chip); }
  .pw-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pw-btn { border: 1px solid var(--line); background: var(--btn); color: var(--fg); padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: none; }
  .pw-btn:hover { background: var(--btn-hover); }
  .pw-actions { display: flex; gap: 8px; margin-top: 8px; }
  .pw-actions button { flex: 1; padding: 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--btn); color: var(--fg); font-weight: 600; cursor: pointer; box-shadow: none; }
  .pw-actions .pw-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }
  #pwInput { box-sizing: border-box; }
  .pw-current { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .pw-current code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pw-icon { border: 1px solid var(--line); background: var(--btn); color: var(--muted); padding: 6px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; box-shadow: none; }
  .pw-icon:hover { color: var(--fg); background: var(--btn-hover); }
  .lang { display: flex; gap: 2px; background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .lang button { border: none; background: transparent; color: var(--muted); font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 6px; cursor: pointer; box-shadow: none; }
  .lang button.sel { background: var(--bg); color: var(--accent); }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">YX</div>
    <div class="title">YX Bridge<small id="ver" data-i18n="app_sub">browser ⇄ AI agent</small></div>
    <div class="theme" id="theme" role="group" aria-label="Theme">
      <button data-t="auto" title="Авто (как в системе)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg></button>
      <button data-t="light" title="Светлая"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button data-t="dark" title="Тёмная"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>

  <div class="status">
    <span id="dot" class="dot off"></span>
    <span class="state" id="state">…</span>
  </div>

  <div class="info">
    <div class="kv"><span class="k" data-i18n="kv_server">Server</span><code id="url">—</code></div>
    <div class="kv"><span class="k" data-i18n="kv_handled">Commands run</span><span class="v" id="handled">0</span></div>
    <div class="kv"><span class="k" data-i18n="kv_debugger">Debugger on tabs</span><span class="v" id="attached">—</span></div>
  </div>
  <div class="err" id="err"></div>

  <div class="pause" id="pauseRow">
    <div>
      <div class="pause-t" data-i18n="pause_title">AI agent</div>
      <div class="pause-s" id="pauseSub">data is flowing</div>
    </div>
    <button class="switch" id="pause" role="switch" aria-checked="false"><span class="knob"></span></button>
  </div>

  <div class="pw" id="pwRow">
    <div class="pw-head">
      <div>
        <div class="pause-t" data-i18n="pw_title">Connection password</div>
        <div class="pause-s" id="pwState">not set — the port is open</div>
      </div>
      <button id="pwToggle" class="pw-btn" data-i18n="pw_change">Change</button>
    </div>
    <div class="pw-current" id="pwCurrent" hidden>
      <code id="pwValue">••••••••</code>
      <button id="pwReveal" class="pw-icon" data-i18n-title="pw_reveal_title" title="Show password">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="pwCopy" class="pw-icon" data-i18n-title="pw_copy_title" title="Copy">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </div>
    <div id="pwEdit" hidden>
      <input id="pwInput" class="search" type="text" data-i18n-ph="pw_ph" placeholder="New password (blank = generate)" style="width:100%;margin-top:10px">
      <div class="pw-actions">
        <button id="pwSave" class="pw-primary" data-i18n="pw_save">Save</button>
        <button id="pwClear" data-i18n="pw_clear">Remove password</button>
      </div>
      <div class="pause-s" id="pwMsg" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="stats">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span data-i18n="btn_stats">Browser statistics</span>
    </button>
    <button id="reconnect">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/></svg>
      <span data-i18n="btn_reconnect">Reconnect</span>
    </button>
  </div>

  <div class="foot">
    <div class="lang" id="lang"><button data-l="en">EN</button><button data-l="ru">RU</button></div>
    <a id="author" href="https://github.com/MRsuperkosmos/yx-bridge" target="_blank" rel="noopener" title="GitHub">MRsuperkosmos</a>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
